<head>
<meta charset="UTF-8">

<style>
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background-color: #f0f7ff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
  .container { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 85, 170, 0.15); width: 100%; max-width: 580px; padding: 28px; text-align: center; }
  h1 { color: #0066cc; font-size: 26px; margin-bottom: 5px; }
  .subtitle { color: #666; font-size: 15px; margin-bottom: 18px; }
  .controls { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; background: #e6f2ff; padding: 12px 15px; border-radius: 12px; }
  .select-group { display: flex; flex-wrap: wrap; gap: 8px; }
  select { padding: 8px 10px; font-size: 15px; border-radius: 8px; border: 2px solid #0066cc; background: white; font-weight: bold; color: #0066cc; cursor: pointer; }
  .score-board { font-size: 18px; font-weight: bold; color: #d9534f; }
  .word-card { background: #fff9e6; border: 3px dashed #ffb84d; border-radius: 16px; padding: 28px 20px; margin-bottom: 22px; position: relative; }
  .english-word { font-size: 44px; font-weight: bold; color: #222; margin: 12px 0 16px; letter-spacing: 0.5px; line-height: 1.25; }
  .english-word.sentence-mode { font-size: 32px; }
  .speak-btn { background: #ff9900; color: white; border: none; border-radius: 50px; padding: 8px 20px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #cc7a00; }
  .speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #cc7a00; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .options-grid { grid-template-columns: 1fr; } }
  .option-btn { background: #ffffff; border: 3px solid #cce0ff; border-radius: 14px; padding: 16px 12px; font-size: 19px; font-weight: bold; color: #0055aa; cursor: pointer; transition: all 0.2s; }
  .option-btn:hover { background: #eef5ff; border-color: #0066cc; }
  .option-btn.correct { background: #28a745; border-color: #1e7e34; color: white; }
  .option-btn.wrong { background: #dc3545; border-color: #bd2130; color: white; }
  .feedback { margin-top: 18px; font-size: 19px; font-weight: bold; min-height: 28px; }
  .combo-badge { display: inline-block; background: #ff4757; color: white; padding: 3px 10px; border-radius: 20px; font-size: 14px; margin-left: 6px; vertical-align: middle; }
</style>

<body>

  <div class="controls">
    <div class="select-group">

        <option value="u1">Unit 1 (姓名與問候)</option>
        <option value="u2">Unit 2 (數字 6-10)</option>
        <option value="u3">Unit 3 (文具用品)</option>
        <option value="u4">Unit 4 (顏色)</option>
        <option value="fest">Festivals (萬聖節)</option>
      </select>
      <select id="typeSelect" onchange="resetGame()">
        <option value="all">📚 單字 + 句子</option>
        <option value="word">🔤 只練單字</option>
        <option value="sentence">💬 只練句子</option>
      </select>
    </div>
    <div class="score-board">

    <div class="english-word" id="questionWord">Loading...</div>
    <button class="speak-btn" onclick="speakCurrentWord()">🔊 聽發音</button>

  <div class="options-grid" id="optionsContainer"></div>
  <div class="feedback" id="feedbackText"></div>

let currentWordObj = null;
let score = 0;
let combo = 0;
let isAnswering = false;

function speakWord(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text.replace("/", " or "));
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }
}

function speakCurrentWord() {
  if (currentWordObj) speakWord(currentWordObj.word);
}

function getPool() {
  const u = document.getElementById("unitSelect").value;
  const t = document.getElementById("typeSelect").value;
  return vocabulary.filter(i => (u === "all" || i.unit === u) && (t === "all" || i.type === t));
}

function nextQuestion() {
  isAnswering = true;
  document.getElementById("feedbackText").textContent = "";
  const pool = getPool();
  if (pool.length === 0) {
    document.getElementById("unitTag").textContent = "提示";
    document.getElementById("questionWord").textContent = "此分類暫無題目";
    document.getElementById("optionsContainer").innerHTML = "";
    return;
  }
  currentWordObj = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById("unitTag").textContent = currentWordObj.unitName;
  const qEl = document.getElementById("questionWord");
  qEl.textContent = currentWordObj.word;
  qEl.classList.toggle("sentence-mode", currentWordObj.type === "sentence");

  let distractors = vocabulary.filter(i => i.type === currentWordObj.type && i.meaning !== currentWordObj.meaning);
  distractors.sort(() => Math.random() - 0.5);
  let options = [currentWordObj, ...distractors.slice(0, 3)].sort(() => Math.random() - 0.5);

  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt.meaning;
    btn.onclick = () => checkAnswer(btn, opt);
    container.appendChild(btn);
  });
  speakCurrentWord();
}

function checkAnswer(selectedBtn, selectedOpt) {
  if (!isAnswering) return;
  isAnswering = false;
  const allBtns = document.querySelectorAll(".option-btn");
  const feedback = document.getElementById("feedbackText");
  if (selectedOpt.meaning === currentWordObj.meaning) {
    selectedBtn.classList.add("correct");
    score += 10;
    combo += 1;
    feedback.style.color = "#28a745";
    feedback.textContent = "⭕ 答對了！太棒了！";
  } else {
    selectedBtn.classList.add("wrong");
    combo = 0;
    feedback.style.color = "#dc3545";
    feedback.textContent = "❌ 正確答案是：" + currentWordObj.meaning;
    allBtns.forEach(btn => { if (btn.textContent === currentWordObj.meaning) btn.classList.add("correct"); });
  }
  document.getElementById("score").textContent = score;
  const badge = document.getElementById("comboBadge");
  badge.style.display = combo >= 2 ? "inline-block" : "none";
  badge.textContent = combo + " 連勝!";
  setTimeout(nextQuestion, 1400);
}

function resetGame() {
  score = 0;
  combo = 0;
  document.getElementById("score").textContent = score;
  document.getElementById("comboBadge").style.display = "none";
  nextQuestion();
}

nextQuestion();
</script>
</body>
</html>
